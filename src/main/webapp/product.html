<!DOCTYPE html>
<html>
<head><title>Select Product</title></head>
<body>
    <h2>Select a Product</h2>
    <form action="ProductServlet" method="post">
        <label>Choose Product:</label>
        <select name="product">
            <option value="Pen:10">Pen - Rs.10</option>
            <option value="Notebook:50">Notebook - Rs.50</option>
            <option value="Bag:500">Bag - Rs.500</option>
        </select>
        <br><br>
        <input type="submit" value="Next">
    </form>
</body>
</html>
