<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Submission</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: #ffffff;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            width: 350px;
            position: relative;
        }

        .card::before {
            content: "";
            position: absolute;
            height: 5px;
            width: 100%;
            background-color: #2196F3;
            top: 0;
            left: 0;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
        }

        h2 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #bbb;
            font-size: 14px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #2196F3;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s ease;
            font-size: 15px;
        }

        input[type="submit"]:hover {
            background-color: #0b7dda;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Enter Marks</h2>
        <form action="input" method="post">
            <label for="name">Student Name</label>
            <input type="text" name="name" id="name" required>

            <label for="marks">Marks (out of 100)</label>
            <input type="number" name="marks" id="marks" min="0" max="100" required>

            <input type="submit" value="Get Grade">
        </form>
    </div>
</body>
</html>
