<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Client</title>
</head>
<body>
<h1>Edit Client</h1>

<form th:action="@{/clients/edit/{id}(id=${client.id})}" th:object="${client}" method="post">
    Name: <input type="text" th:field="*{name}" required/><br/>
    Email: <input type="email" th:field="*{email}" required/><br/>
    Phone: <input type="text" th:field="*{phone}" required/><br/>
    Address: <input type="text" th:field="*{address}" required/><br/>
    <button type="submit">Update</button>
</form>

<a href="/clients">Back to list</a>
</body>
</html>
