<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      background-color: #4c8b8b;
      color: white;
      padding: 15px;
      border-radius: 6px;
    }
    h1 {
      margin: 0;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    figure {
      background: white;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    figcaption {
      margin-top: 8px;
      font-size: 0.9em;
      color: #333;
    }
    .notes {
      background: #fff7e6;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
    }
    .submit-section {
      margin-top: 20px;
      text-align: center;
    }
    button {
      padding: 10px 15px;
      font-size: 1em;
      background-color: #4c8b8b;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #3a6a6a;
    }
  </style>
</head>
<body>

<header>
  <h1>Image Lab — Gallery</h1>
  <p>Practice with &lt;img&gt;, srcset, &lt;picture&gt;, SVG, and accessibility</p>
</header>

<section class="gallery">
 
  <figure>
    <img src="images/rice.jpeg" alt="Rice bag" loading="lazy" width="200">
    <figcaption>Rice — Bag</figcaption>
  </figure>

 
  <figure>
    <picture>
      <source srcset="images/assortedsnacks.jpeg" type="image/jpeg">
      <img src="images/assortedsnacks.jpeg" alt="Assorted Snacks Box" loading="lazy" width="200">
    </picture>
    <figcaption>Assorted Snacks Box</figcaption>
  </figure>


  <figure>
    <img src="images/tracker.jpg" alt="Smart Tracker Watch" width="200">
    <figcaption>Smart Tracker Watch</figcaption>
  </figure>

 
  <figure>
    <img src="images/social.jpg" alt="" aria-hidden="true" width="200">
    <figcaption>Decorative Social Icon</figcaption>
  </figure>

  <figure>
    <img src="images/smarttv.jpg" alt="Smart TV Categories" usemap="#storemap" width="200">
    <map name="storemap">
      <area shape="rect" coords="0,0,100,100" href="images/rice.jpeg" alt="Rice section">
      <area shape="rect" coords="100,0,200,100" href="images/assortedsnacks.jpeg" alt="Snacks section">
    </map>
    <figcaption>Click a section to view item</figcaption>
  </figure>
</section>

<section class="notes">
  <h2>Notes</h2>
  <ul>
    <li>All images are loaded locally from the <code>images</code> folder.</li>
    <li><code>loading="lazy"</code> helps defer loading off-screen images.</li>
    
  </ul>
</section>

<div class="submit-section">
  <form action="#" method="post">
    <button type="submit">Submit Lab</button>
  </form>
</div>

</body>
</html>
