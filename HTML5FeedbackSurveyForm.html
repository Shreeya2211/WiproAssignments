<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Feedback Survey</title>
</head>
<body bgcolor="#f0f8ff" text="#000000">

    
    <header align="center" bgcolor="#4682b4">
        <h1>Website Feedback Survey</h1>
        <p>We value your opinion. Please take a minute to share your thoughts.</p>
    </header>

    
    <nav align="center" bgcolor="#d3d3d3">
        <a href="#" style="margin: 10px;">Home</a> |
        <a href="#" style="margin: 10px;">About</a> |
        <a href="#" style="margin: 10px;">Contact</a>
    </nav>

    
    <main>
        <form>
            
            <section bgcolor="#e6e6fa" style="padding: 10px;">
                <h2>Personal Information</h2>
                <label>Full Name: <input type="text" name="fullname" required></label><br><br>
                <label>Email Address: <input type="email" name="email" required></label><br><br>
                <label>Age: <input type="number" name="age" min="10" max="100"></label><br><br>
            </section>

           
            <section bgcolor="#fffacd" style="padding: 10px;">
                <h2>Website Rating</h2>
                <label>Rate website design (1–10): 
                    <input type="range" name="design" min="1" max="10">
                </label><br><br>

                <p>Rate content quality:</p>
                <label><input type="radio" name="content" value="Excellent"> Excellent</label><br>
                <label><input type="radio" name="content" value="Good"> Good</label><br>
                <label><input type="radio" name="content" value="Average"> Average</label><br>
                <label><input type="radio" name="content" value="Poor"> Poor</label><br><br>

                <label>Most visited page:
                    <select name="visited">
                        <option>Home</option>
                        <option>Blog</option>
                        <option>Products</option>
                        <option>Contact</option>
                    </select>
                </label>
            </section>

         
            <section bgcolor="#f5f5dc" style="padding: 10px;">
                <h2>Suggestions</h2>
                <textarea name="suggestions" rows="4" cols="50" placeholder="Your suggestions here..."></textarea><br><br>
                <label>
                    <input type="checkbox" name="contact"> I agree to be contacted regarding my feedback
                </label>
            </section>

         
            <p align="center">
                <input type="submit" value="Submit Feedback">
            </p>
        </form>
    </main>

    <!-- Aside -->
    <aside align="center" bgcolor="#ffe4e1">
        <p><strong>Your feedback helps us improve our website experience for everyone.</strong></p>
    </aside>

    <!-- Footer -->
    <footer align="center" bgcolor="#4682b4">
        <p>© 2025 Website Survey</p>
    </footer>

</body>
</html>
