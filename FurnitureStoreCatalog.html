<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Store Catalog</title>
    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 20px;
        }
        h1 {
            margin: 0;
        }
        p {
            color: #555;
        }
        .product-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 220px;
            background-color: white;
            box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .product-card img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .price {
            font-weight: bold;
            margin: 10px 0;
        }
        .buy-btn {
            background-color: #007bff;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .buy-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Furniture Store Catalog</h1>
        <p>Find the best furniture for your home</p>
    </header>

    <section class="product-container">
        <!-- Sofa Card -->
        <div class="product-card">
            <img src="https://via.placeholder.com/200x150?text=Sofa" alt="Sofa">
            <h3>Sofa</h3>
            <p>Comfortable and stylish sofa</p>
            <p class="price">$499</p>
            <button class="buy-btn">Buy Now</button>
        </div>

        <!-- Dining Table Card with Inline CSS for Background -->
        <div class="product-card" style="background-color: #f0fff0;">
            <img src="https://via.placeholder.com/200x150?text=Dining+Table" alt="Dining Table">
            <h3 style="color: brown;">Dining Table</h3> <!-- Inline CSS for text color -->
            <p>Wooden dining table</p>
            <p class="price">$299</p>
            <button class="buy-btn" style="background-color: green; color: white;">Buy Now</button> <!-- Inline CSS for button -->
        </div>

        <!-- Chair Card -->
        <div class="product-card">
            <img src="https://via.placeholder.com/200x150?text=Chair" alt="Chair">
            <h3>Chair</h3>
            <p>Modern chair for any room</p>
            <p class="price">$149</p>
            <button class="buy-btn">Buy Now</button>
        </div>
    </section>

</body>
</html>
