<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML5 Multimedia Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #eef2f3;
            color: #333;
        }

        h2 {
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 8px;
            text-align: center;
            color: #2e7d32;
        }

        p {
            text-align: center;
            font-size: 1.1em;
        }

        section {
            margin: 25px auto;
            padding: 15px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            width: 80%;
        }

        h3 {
            color: #1a237e;
            margin-bottom: 10px;
        }

        video, audio, embed, iframe, svg {
            display: block;
            margin: 10px auto;
            border: 2px solid #ddd;
            border-radius: 5px;
            background-color: #f7f7f7;
        }

        video:hover, audio:hover, embed:hover, iframe:hover {
            border-color: #4CAF50;
        }

        a {
            color: #1565c0;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>HTML5 Multimedia Lab</h2>
    <p>This page demonstrates video, audio, embed (PDF), iframe, and inline SVG.</p>

    <!-- Video -->
    <section>
        <h3>Video (Nature Sample)</h3>
        <video controls poster="https://via.placeholder.com/480x270.png?text=Video+Preview" width="480">
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </section>

    <!-- Audio -->
    <section>
        <h3>Audio (Sample Music)</h3>
        <audio controls loop>
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"  type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </section>

    <!-- Embed PDF -->
    <section>
        <h3>Embed (Sample PDF)</h3>
        <embed src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" 
               type="application/pdf" width="600" height="400">
        <p>If not visible, <a href="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" download>download PDF</a>.</p>
    </section>

    <!-- Iframe -->
    <section>
        <h3>Iframe (Wikipedia Page)</h3>
        <iframe src="https://en.wikipedia.org/wiki/HTML5" width="500" height="200" title="Demo HTML Preview"></iframe>
    </section>

    <!-- Inline SVG -->
    <section>
        <h3>Inline SVG</h3>
        <svg width="100" height="100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="40" stroke="blue" stroke-width="3" fill="lightblue" />
            Sorry, your browser does not support inline SVG.
        </svg>
    </section>
</body>
</html>
