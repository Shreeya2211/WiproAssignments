<!DOCTYPE html>
<html>
<head>
    <title>📚 JSON – Book Store Management</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-shadow: 0 0 10px #00ffe7;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            backdrop-filter: blur(6px);
            max-width: 600px;
            box-shadow: 0 0 15px rgba(0,255,255,0.2);
        }
        button {
            margin: 10px;
            padding: 8px 15px;
            border: none;
            background: #00c6ff;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background: #0072ff;
        }
        pre {
            text-align: left;
            background: rgba(0,0,0,0.6);
            padding: 12px;
            border-radius: 8px;
            color: #00ffb3;
            font-family: monospace;
        }
    </style>
    <script>
        let books = [
            { title: "Learn React.js", author: "Shreya", price: 550, available: true },
            { title: "Mastering Python", author: "Ravi", price: 750, available: true },
            { title: "Data Science Essentials", author: "Ankit", price: 900, available: false }
        ];

        function displayAllBooks() {
            let output = "All Books:\n";
            for (let book of books) {
                output += `Title: ${book.title}, Author: ${book.author}, Price: ₹${book.price}, Available: ${book.available}\n`;
            }
            document.getElementById("result").innerText = output;
        }

        function displayAvailableBooks() {
            let output = "Available Books:\n";
            for (let book of books) {
                if (book.available) {
                    output += `Title: ${book.title}, Author: ${book.author}, Price: ₹${book.price}\n`;
                }
            }
            document.getElementById("result").innerText = output;
        }

        function addBook() {
            books.push({ title: "AI with TensorFlow", author: "Neha", price: 1200, available: true });
            let titles = books.map(b => b.title).join(", ");
            document.getElementById("result").innerText = "After Adding:\n" + titles;
        }

        function updatePrice() {
            let bookTitle = "Learn React.js";
            for (let book of books) {
                if (book.title === bookTitle) {
                    book.price = 600;
                }
            }
            let output = "After Price Update:\n";
            for (let book of books) {
                output += `${book.title} - ₹${book.price}\n`;
            }
            document.getElementById("result").innerText = output;
        }

        function deleteBook() {
            books = books.filter(book => book.title !== "Learn React.js");
            let titles = books.map(b => b.title).join(", ");
            document.getElementById("result").innerText = "After Deletion:\n" + titles;
        }
    </script>
</head>
<body>
    <h1>📚 JSON – Book Store Management</h1>
    <div class="container">
        <button onclick="displayAllBooks()">Show All Books</button>
        <button onclick="displayAvailableBooks()">Show Available Books</button>
        <button onclick="addBook()">Add New Book</button>
        <button onclick="updatePrice()">Update Book Price</button>
        <button onclick="deleteBook()">Delete a Book</button>
        <pre id="result"></pre>
    </div>
</body>
</html>
